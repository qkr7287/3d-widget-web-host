services:
  full-babylon:
    build: .
    env_file:
      - .env.full
    command: npm run dev:compare
    restart: unless-stopped
    ports:
      - "5200:5173"
      - "5201:5174"
      - "5202:6100"

  webhost-only-babylon:
    build: .
    env_file:
      - .env.webhost
    command: npm run dev:host
    restart: unless-stopped
    ports:
      - "5203:5173"
    depends_on:
      - full

  full-three:
    build: .
    env_file:
      - .env.full.three
    command: npm run dev:three:compare
    restart: unless-stopped
    ports:
      - "5204:5175"
      - "5205:5176"
      - "5206:6101"

  webhost-only-three:
    build: .
    env_file:
      - .env.webhost.three
    command: npm run dev:three:host
    restart: unless-stopped
    ports:
      - "5207:5175"
    depends_on:
      - full-three
